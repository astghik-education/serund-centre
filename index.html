<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ՍԵՐունդ — կրթական կենտրոն</title>

  <meta
    name="description"
    content="ՍԵՐունդ․ կրթություն և զարգացում առանց սահմանափակումների։ Երևան, Մոլդովական 24/7։"
  >

  <link rel="icon" href="logo.jpg">

  <style>
    :root {
      --green: #028c36;
      --dark: #123b29;
      --ink: #213c2c;
      --muted: #59695d;
      --bg: #fafcf8;
      --mint: #eaf4e9;
      --yellow: #edf0b0;
      --line: #d7e3d8;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 110px;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.75
        "Noto Sans Armenian",
        "DejaVu Sans",
        Arial,
        sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    img {
      display: block;
      max-width: 100%;
    }

    h1, h2, h3, p {
      margin: 0;
    }

    h1, h2, h3 {
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    h1 {
      font-size: clamp(2rem, 4vw, 3.7rem);
    }

    h2 {
      font-size: clamp(1.7rem, 3vw, 2.6rem);
    }

    h3 {
      font-size: 1.15rem;
    }

    p {
      color: var(--muted);
    }

    [hidden] {
      display: none !important;
    }

    :focus-visible {
      outline: 3px solid #c49616;
      outline-offset: 5px;
    }

    .wrap {
      width: min(1180px, calc(100% - 40px));
      margin: auto;
    }

    .brand-word {
      color: var(--green) !important;
      font-weight: 800;
    }

    .skip {
      position: fixed;
      top: -100px;
      left: 15px;
      z-index: 100;
      background: white;
      padding: 12px;
    }

    .skip:focus {
      top: 12px;
    }

    .announcement {
      text-align: center;
      background: var(--dark);
      color: white;
      padding: 8px 16px;
      font-size: 0.875rem;
    }

    .header {
      position: sticky;
      top: 0;
      background: rgba(250, 252, 248, 0.98);
      border-bottom: 1px solid var(--line);
      z-index: 20;
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 94px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 58px;
      height: 58px;
      object-fit: contain;
      border-radius: 50%;
      background: white;
    }

    .brand strong {
      display: block;
      font-size: 1.2rem;
    }

    .brand small {
      display: block;
      font-size: 0.875rem;
      color: var(--muted);
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav a {
      font-size: 0.875rem;
    }

    .nav a:hover {
      color: var(--green);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .languages {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: white;
    }

    .languages button {
      border: 0;
      background: transparent;
      padding: 9px 10px;
      font-size: 0.875rem;
      color: var(--ink);
    }

    .languages button[aria-pressed="true"] {
      background: var(--green);
      color: white;
    }

    .menu {
      display: none;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      border-radius: 10px;
      padding: 9px 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 13px 21px;
      min-height: 50px;
      border: 1px solid var(--green);
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-weight: 700;
      text-align: center;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      background: #006d31;
      color: white;
      transform: translateY(-2px);
    }

    .btn.alt {
      background: transparent;
      color: var(--dark);
      border-color: #9bb29e;
    }

    .btn.alt:hover {
      background: var(--mint);
    }

    .btn.light {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--dark);
    }

    .eyebrow {
      font-size: 0.875rem;
      color: var(--green);
      font-weight: 700;
      margin-bottom: 14px;
    }

    section {
      padding: 75px 0;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      align-items: center;
      gap: 55px;
    }

    .hero p {
      margin: 23px 0;
      max-width: 600px;
      font-size: 1.08rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 25px;
    }

    .hero-tags span {
      border: 1px solid var(--line);
      border-radius: 30px;
      padding: 6px 12px;
      font-size: 0.875rem;
    }

    .logo-stage {
      background: var(--mint);
      border-radius: 120px 120px 25px 25px;
      padding: 38px 28px;
      text-align: center;
    }

    .logo-stage img {
      width: 280px;
      aspect-ratio: 1;
      object-fit: contain;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: white;
    }

    .logo-stage h2 {
      font-size: 1.5rem;
    }

    .logo-stage p {
      font-size: 1rem;
      margin: 12px 0;
    }

    .ribbon {
      background: var(--dark);
      color: white;
    }

    .ribbon-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
      padding: 27px 0;
    }

    .ribbon-grid div {
      border-left: 1px solid #ffffff40;
      padding-left: 18px;
    }

    .ribbon-grid strong {
      display: block;
    }

    .ribbon-grid span {
      color: #d6e6da;
      font-size: 0.875rem;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 35px;
      margin-bottom: 30px;
    }

    .section-head p {
      max-width: 460px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .filters button {
      border: 1px solid var(--line);
      border-radius: 25px;
      background: white;
      color: var(--muted);
      padding: 10px 17px;
      font-size: 0.9rem;
    }

    .filters button[aria-pressed="true"] {
      background: var(--dark);
      border-color: var(--dark);
      color: white;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      padding: 27px;
      border: 1px solid var(--line);
      border-radius: 23px;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: start;
    }

    .card-number {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--mint);
      color: var(--green);
      margin-bottom: 20px;
      font-size: 0.875rem;
      font-weight: 700;
    }

    .tag {
      color: var(--green);
      font-size: 0.875rem;
      margin: 12px 0;
    }

    .card p {
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .card details {
      width: 100%;
      margin-top: auto;
    }

    .card summary {
      cursor: pointer;
      color: var(--dark);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .card details p {
      margin: 12px 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .english {
      background: var(--dark);
      color: white;
      border-radius: 28px;
      padding: 40px;
      margin-top: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
    }

    .english p {
      color: #d6e6da;
      margin: 16px 0 22px;
    }

    .english .eyebrow {
      color: var(--yellow);
    }

    .english ul {
      padding-left: 24px;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    .about {
      background: var(--mint);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 55px;
    }

    .about-copy p {
      margin-top: 20px;
    }

    .values {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .value {
      padding-top: 20px;
      border-top: 1px solid #abc8b0;
    }

    .value p {
      margin-top: 10px;
      font-size: 0.95rem;
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }

    .person {
      background: white;
      border: 1px solid var(--line);
      border-radius: 20px;
      overflow: hidden;
    }

    .portrait {
      aspect-ratio: 4/5;
      background: var(--mint);
      position: relative;
    }

    .portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      inset: 0;
    }

    .photo-placeholder {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      text-align: center;
      color: #53685a;
      font-size: 0.9rem;
    }

    .person-copy {
      padding: 20px;
    }

    .person-copy h3 {
      font-size: 1rem;
    }

    .person-copy p {
      font-size: 0.875rem;
      margin-top: 7px;
    }

    .gallery-section {
      background: var(--mint);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .gallery-item {
      margin: 0;
      overflow: hidden;
      border-radius: 23px;
      background: white;
      border: 1px solid var(--line);
    }

    .gallery-open {
      display: block;
      width: 100%;
      position: relative;
      aspect-ratio: 4/3;
      padding: 0;
      border: 0;
      background: #dcebdd;
      overflow: hidden;
    }

    .gallery-open:disabled {
      cursor: default;
    }

    .gallery-open img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .gallery-open:not(:disabled):hover img {
      transform: scale(1.045);
    }

    .gallery-placeholder {
      display: flex;
      height: 100%;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      padding: 20px;
      font-size: 0.95rem;
    }

    .gallery-caption {
      padding: 18px 20px;
      font-size: 1rem;
      font-weight: 700;
    }

    .lightbox {
      width: min(1100px, calc(100% - 24px));
      max-height: 94dvh;
      padding: 16px;
      border: 0;
      border-radius: 18px;
      background: #102419;
      color: white;
      overflow: auto;
    }

    .lightbox::backdrop {
      background: #07130de8;
    }

    .lightbox-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 12px;
    }

    .lightbox-top button,
    .lightbox-controls button {
      border: 1px solid #ffffff60;
      border-radius: 10px;
      background: transparent;
      color: white;
      padding: 10px 16px;
      font: inherit;
      cursor: pointer;
    }

    .lightbox img {
      width: 100%;
      height: min(65vh, 720px);
      object-fit: contain;
      background: #07170d;
      border-radius: 10px;
    }

    .lightbox-caption {
      color: white;
      text-align: center;
      margin: 16px 0;
    }

    .lightbox-controls {
      display: flex;
      justify-content: space-between;
      gap: 15px;
    }

    .lightbox-controls button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .faq {
      background: white;
    }

    .faq-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 50px;
    }

    .faq details {
      border-bottom: 1px solid var(--line);
      padding: 20px 0;
    }

    .faq summary {
      font-weight: 700;
      cursor: pointer;
    }

    .faq details p {
      margin-top: 15px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 45px;
    }

    .contact-copy > p {
      margin: 20px 0;
    }

    .contact-row {
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    .contact-row strong {
      display: block;
      color: var(--green);
      font-size: 0.875rem;
      margin-bottom: 5px;
    }

    .contact-row a {
      overflow-wrap: anywhere;
    }

    .contact-row a:hover {
      text-decoration: underline;
    }

    .contact-copy .actions {
      margin-top: 25px;
    }

    .map-card {
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      background: white;
    }

    .map-card iframe {
      display: block;
      width: 100%;
      height: 420px;
      border: 0;
    }

    .map-foot {
      padding: 22px;
    }

    .map-foot p {
      font-size: 0.875rem;
      margin-bottom: 15px;
    }

    .footer {
      background: var(--dark);
      color: white;
      padding: 40px 0 22px;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 30px;
    }

    .footer .brand {
      background: white;
      padding: 12px 16px;
      border-radius: 15px;
      width: fit-content;
    }

    .footer-copy {
      color: #d6e6da;
      font-size: 0.9rem;
      margin-top: 17px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 22px;
      font-size: 0.9rem;
    }

    .footer-bottom {
      margin-top: 30px;
      border-top: 1px solid #ffffff30;
      padding-top: 20px;
      color: #d6e6da;
      font-size: 0.875rem;
    }

    .noscript {
      padding: 30px;
      text-align: center;
    }

    @media (max-width: 1100px) {
      .nav {
        gap: 12px;
      }

      .header-inner {
        gap: 12px;
      }

      .nav a {
        font-size: 0.8rem;
      }

      .team-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 950px) {
      .menu {
        display: block;
      }

      .nav {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        flex-direction: column;
        align-items: stretch;
        background: var(--bg);
        padding: 20px;
        box-shadow: 0 20px 30px #173c2515;
      }

      .nav.open {
        display: flex;
      }

      .nav a {
        padding: 10px;
        font-size: 1rem;
      }

      .hero-grid {
        gap: 30px;
      }

      .cards,
      .team-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 800px) {
      .gallery-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 700px) {
      .wrap {
        width: calc(100% - 32px);
      }

      .header-inner {
        flex-wrap: wrap;
        padding: 12px 0;
        gap: 10px;
      }

      .brand img {
        width: 45px;
        height: 45px;
      }

      .brand strong {
        font-size: 1.1rem;
      }

      .brand small {
        font-size: 0.8rem;
      }

      .header-controls {
        gap: 7px;
      }

      .languages button {
        padding: 8px;
      }

      .menu {
        font-size: 0.875rem;
        padding: 8px;
      }

      .hero-grid,
      .about-grid,
      .faq-grid,
      .contact-grid,
      .english {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .hero {
        padding-top: 42px;
      }

      .logo-stage {
        max-width: 420px;
        width: 100%;
        margin: auto;
        padding: 30px;
      }

      .logo-stage img {
        width: 220px;
      }

      .hero p {
        font-size: 1rem;
      }

      .ribbon-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .section-head {
        display: block;
      }

      .section-head p {
        margin-top: 18px;
      }

      section {
        padding: 55px 0;
      }

      .english {
        padding: 28px;
      }

      .map-card iframe {
        height: 350px;
      }

      .footer-top {
        display: block;
      }

      .footer-links {
        margin-top: 25px;
      }
    }

    @media (max-width: 500px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .lightbox {
        padding: 12px;
      }

      .lightbox img {
        height: 55vh;
      }

      .lightbox-controls button {
        font-size: 0.875rem;
        padding: 10px;
      }

      .gallery-caption {
        padding: 16px;
      }
    }

    @media (max-width: 440px) {
      .cards,
      .values {
        grid-template-columns: 1fr;
      }

      .hero .actions .btn {
        width: 100%;
      }

      .team-grid {
        gap: 12px;
      }

      .person-copy {
        padding: 14px;
      }

      .person-copy h3 {
        font-size: 0.9rem;
      }

      .brand small {
        font-size: 0.75rem;
      }

      .header-controls {
        margin-left: auto;
      }

      .photo-placeholder {
        padding: 12px;
        font-size: 0.875rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip" href="#main" id="skip">
    Անցնել հիմնական բովանդակությանը
  </a>

  <div class="announcement" id="announcement"></div>

  <header class="header">
    <div class="wrap header-inner">
      <a class="brand" href="#home">
        <img
          src="logo.jpg"
          alt="ՍԵՐունդ"
          width="58"
          height="58"
        >

        <div>
          <strong class="brand-word">ՍԵՐունդ</strong>
          <small id="brand-subtitle"></small>
        </div>
      </a>

      <nav
        class="nav"
        id="navigation"
        aria-label="Navigation"
      ></nav>

      <div class="header-controls">
        <div
          class="languages"
          role="group"
          aria-label="Language"
        >
          <button
            type="button"
            data-lang="hy"
            aria-label="Հայերեն"
            aria-pressed="true"
          >
            ՀԱՅ
          </button>

          <button
            type="button"
            data-lang="ru"
            aria-label="Русский"
            aria-pressed="false"
          >
            РУС
          </button>

          <button
            type="button"
            data-lang="en"
            aria-label="English"
            aria-pressed="false"
          >
            ENG
          </button>
        </div>

        <button
          class="menu"
          id="menu"
          type="button"
          aria-controls="navigation"
          aria-expanded="false"
        >
          Մենյու
        </button>
      </div>
    </div>
  </header>

  <main id="main"></main>

  <footer class="footer" id="footer"></footer>

  <dialog
    class="lightbox"
    id="lightbox"
    aria-label="Gallery"
  >
    <div class="lightbox-top">
      <span id="lightbox-count" aria-live="polite"></span>

      <button id="lightbox-close" type="button">
        Փակել
      </button>
    </div>

    <img id="lightbox-image" alt="">

    <p
      class="lightbox-caption"
      id="lightbox-caption"
      aria-live="polite"
    ></p>

    <div class="lightbox-controls">
      <button type="button" id="lightbox-prev">
        Նախորդ
      </button>

      <button type="button" id="lightbox-next">
        Հաջորդ
      </button>
    </div>
  </dialog>

  <noscript>
    <p class="noscript">
      Միացրեք JavaScript-ը։ /
      Включите JavaScript. /
      Please enable JavaScript.
      <br>
      <a href="tel:+37477047947">+374 77 047 947</a>
      <br>
      Երևան, Նոր Նորք, Մոլդովական 24/7
    </p>
  </noscript>

  <script>
    /*

    const menu = document.getElementById('menu');
    const nav = document.getElementById('navigation');
    const lightbox = document.getElementById('lightbox');

    const readyPhotos = new Set();
    let currentPhoto = 0;

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, function (character) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[character];
      });
    }

    function closeMenu() {
      nav.classList.remove('open');
      menu.setAttribute('aria-expanded', 'false');
    }

    function safeLink(value) {
      try {
        const url = new URL(value);
        return url.protocol === 'https:' ? url.href : '';
      } catch {
        return '';
      }
    }

    function showPhoto(index) {
      const available = [...readyPhotos].sort(function (a, b) {
        return a - b;
      });

      if (!available.includes(index)) {
        return;
      }

      currentPhoto = index;

      const photo = GALLERY[index];
      const image = document.getElementById('lightbox-image');

      image.src = photo.src;
      image.alt = photo[language];

      document.getElementById('lightbox-caption').textContent =
        photo[language];

      document.getElementById('lightbox-count').textContent =
        (available.indexOf(index) + 1) + ' / ' + available.length;

      document.getElementById('lightbox-prev').disabled =
        available.length < 2;

      document.getElementById('lightbox-next').disabled =
        available.length < 2;
    }

    function movePhoto(direction) {
      const available = [...readyPhotos].sort(function (a, b) {
        return a - b;
      });

      if (!available.length) {
        return;
      }

      const next =
        (
          available.indexOf(currentPhoto) +
          direction +
          available.length
        ) % available.length;

      showPhoto(available[next]);
    }

    document.getElementById('lightbox-close').addEventListener(
      'click',
      function () {
        lightbox.close();
      }
    );

    document.getElementById('lightbox-prev').addEventListener(
      'click',
      function () {
        movePhoto(-1);
      }
    );

    document.getElementById('lightbox-next').addEventListener(
      'click',
      function () {
        movePhoto(1);
      }
    );

    lightbox.addEventListener('click', function (event) {
      if (event.target !== lightbox) {
        return;
      }

      const bounds = lightbox.getBoundingClientRect();

      const outside =
        event.clientX < bounds.left ||
        event.clientX > bounds.right ||
        event.clientY < bounds.top ||
        event.clientY > bounds.bottom;

      if (outside) {
        lightbox.close();
      }
    });

    lightbox.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowLeft') {
        event.preventDefault();
        movePhoto(-1);
      }

      if (event.key === 'ArrowRight') {
        event.preventDefault();
        movePhoto(1);
      }
    });

    let touchStart = null;
    const viewer = document.getElementById('lightbox-image');

    viewer.addEventListener(
      'touchstart',
      function (event) {
        touchStart = event.touches.length === 1
          ? event.touches[0].clientX
          : null;
      },
      { passive: true }
    );

    viewer.addEventListener(
      'touchend',
      function (event) {
        if (touchStart === null) {
          return;
        }

        const distance =
          event.changedTouches[0].clientX - touchStart;

        if (Math.abs(distance) > 55) {
          movePhoto(distance < 0 ? 1 : -1);
        }

        touchStart = null;
      },
      { passive: true }
    );

        t.heroTitle + ' — ' + t.address;

      document.getElementById('announcement').textContent =
        t.announcement;

      document.getElementById('brand-subtitle').textContent =
        t.center;

      document.getElementById('skip').textContent = t.skip;

      menu.textContent = t.menu;

      nav.setAttribute('aria-label', t.menu);

      document.querySelector('.languages').setAttribute(
        'aria-label',
        lang === 'hy' ? 'Լեզու' : lang === 'ru' ? 'Язык' : 'Language'
      );

      nav.innerHTML =
        ids.map(function (id, index) {
          return `<a href="#${id}">${t.nav[index]}</a>`;
        }).join('') +
        `
          <a
            class="btn"
            href="${wa}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${t.register}
          </a>
        `;

      document.querySelectorAll('[data-lang]').forEach(function (button) {
        button.setAttribute(
          'aria-pressed',
          String(button.dataset.lang === lang)
        );
      });

      document.getElementById('main').innerHTML = `
        <section class="hero" id="home">
          <div class="wrap hero-grid">
            <div>
              <div class="eyebrow">${t.heroLabel}</div>
              <h1>${t.heroTitle}</h1>
              <p>${t.heroDescription}</p>

              <div class="actions">
                <a class="btn" href="#programs">
                  ${t.explore}
                </a>

                <a
                  class="btn alt"
                  href="${wa}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${t.write}
                </a>
              </div>

              <div class="hero-tags">
                ${t.heroTags.map(function (tag) {
                  return `<span>${tag}</span>`;
                }).join('')}
              </div>
            </div>

            <div class="logo-stage">
              <img
                src="logo.jpg"
                alt="ՍԵՐունդ"
                width="280"
                height="280"
              >

              <h2>${t.brandLine}</h2>
              <p>${t.brandDescription}</p>
            </div>
          </div>
        </section>

        <div class="ribbon">
          <div class="wrap ribbon-grid">
            ${t.ribbons.map(function (item) {
              return `
                <div>
                  <strong>${item[0]}</strong>
                  <span>${item[1]}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <section id="programs">
          <div class="wrap">
            <div class="section-head">
              <div>
                <div class="eyebrow">${t.programsLabel}</div>
                <h2>${t.programsTitle}</h2>
              </div>

              <p>${t.programsIntro}</p>
            </div>

            <div
              class="filters"
              role="group"
              aria-label="${t.programsTitle}"
            >
              ${['all', 'learning', 'creative', 'support'].map(
                function (filter, index) {
                  return `
                    <button
                      type="button"
                      data-filter="${filter}"
                      aria-pressed="${activeFilter === filter}"
                    >
                      ${t.filters[index]}
                    </button>
                  `;
                }
              ).join('')}
            </div>

            <div class="cards">
              ${t.programs.map(function (program, index) {
                const hidden =
                  activeFilter !== 'all' &&
                  activeFilter !== categories[index];

                return `
                  <article
                    class="card"
                    data-category="${categories[index]}"
                    ${hidden ? 'hidden' : ''}
                  >
                    <span class="card-number">
                      ${String(index + 1).padStart(2, '0')}
                    </span>

                    <h3>${program[0]}</h3>
                    <span class="tag">${program[1]}</span>
                    <p>${program[2]}</p>

                    <details>
                      <summary>${t.details}</summary>
                      <p>${program[3]}</p>
                    </details>
                  </article>
                `;
              }).join('')}
            </div>

            <div class="english">
              <div>
                <div class="eyebrow">${t.englishLabel}</div>
                <h2>${t.englishTitle}</h2>
                <p>${t.englishDescription}</p>

                <a
                  class="btn light"
                  href="${wa}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${t.register}
                </a>
              </div>

              <ul>
                ${t.englishList.map(function (item) {
                  return `<li>${item}</li>`;
                }).join('')}
              </ul>
            </div>
          </div>
        </section>

        <section class="about" id="about">
          <div class="wrap about-grid">
            <div class="about-copy">
              <div class="eyebrow">${t.aboutLabel}</div>
              <h2>${t.aboutTitle}</h2>
              <p>${t.aboutDescription}</p>
              <p>${t.aboutSecond}</p>
            </div>

            <div class="values">
              ${t.values.map(function (value) {
                return `
                  <div class="value">
                    <h3>${value[0]}</h3>
                    <p>${value[1]}</p>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </section>

        <section id="team">
          <div class="wrap">
            <div class="section-head">
              <div>
                <div class="eyebrow">${t.teamLabel}</div>
                <h2>${t.teamTitle}</h2>
              </div>

              <p>${t.teamIntro}</p>
            </div>

            <div class="team-grid">
              ${TEAM.map(function (person, index) {
                return `
                  <article class="person">
                    <div class="portrait">
                      <div class="photo-placeholder">
                        ${t.photoSoon}
                      </div>

                      ${person.photo ? `
                        <img
                          src="${escapeHtml(person.photo)}"
                          alt="${escapeHtml(person.name || t.roles[index])}"
                          loading="lazy"
                          width="400"
                          height="500"
                        >
                      ` : ''}
                    </div>

                    <div class="person-copy">
                      <h3>${t.roles[index]}</h3>

                      ${person.name ? `
                        <p>${escapeHtml(person.name)}</p>
                      ` : ''}
                    </div>
                  </article>
                `;
              }).join('')}
            </div>
          </div>
        </section>

        <section class="gallery-section" id="gallery">
          <div class="wrap">
            <div class="section-head">
              <div>
                <div class="eyebrow">${t.galleryLabel}</div>
                <h2>${t.galleryTitle}</h2>
              </div>

              <p>${t.galleryIntro}</p>
            </div>

            <div class="gallery-grid">
              ${GALLERY.map(function (photo, index) {
                return `
                  <figure class="gallery-item">
                    <button
                      class="gallery-open"
                      type="button"
                      data-photo="${index}"
                      aria-label="${t.viewPhoto}: ${escapeHtml(photo[lang])}"
                      disabled
                    >
                      <span class="gallery-placeholder">
                        ${t.photoSoon}
                      </span>

                      <img
                        src="${escapeHtml(photo.src)}"
                        alt="${escapeHtml(photo[lang])}"
                        loading="lazy"
                        width="800"
                        height="600"
                      >
                    </button>

                    <figcaption class="gallery-caption">
                      ${escapeHtml(photo[lang])}
                    </figcaption>
                  </figure>
                `;
              }).join('')}
            </div>
          </div>
        </section>

        <section class="faq" id="faq">
          <div class="wrap faq-grid">
            <div>
              <div class="eyebrow">${t.faqLabel}</div>
              <h2>${t.faqTitle}</h2>
            </div>

            <div>
              ${t.faqs.map(function (faq) {
                return `
                  <details>
                    <summary>${faq[0]}</summary>
                    <p>${faq[1]}</p>
                  </details>
                `;
              }).join('')}
            </div>
          </div>
        </section>

        <section id="contact">
          <div class="wrap contact-grid">
            <div class="contact-copy">
              <div class="eyebrow">${t.contactLabel}</div>
              <h2>${t.contactTitle}</h2>
              <p>${t.contactIntro}</p>

              <div class="contact-row">
                <strong>${t.phoneLabel}</strong>

                <a href="${PHONE}">
                  +374 77 047 947
                </a>
              </div>

              <div class="contact-row">
                <strong>${t.addressLabel}</strong>

                <a
                  href="${MAP_URL}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${t.address}
                </a>
              </div>

              <div class="contact-row">
                <strong>Instagram</strong>

                <a
                  href="${INSTAGRAM}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  @serund.educentre
                </a>
              </div>

              ${safeLink(FACEBOOK) ? `
                <div class="contact-row">
                  <strong>Facebook</strong>

                  <a
                    href="${safeLink(FACEBOOK)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    Facebook
                  </a>
                </div>
              ` : ''}

              <div class="actions">
                <a
                  class="btn"
                  href="${wa}"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  ${t.write}
                </a>

                <a class="btn alt" href="${PHONE}">
                  ${t.call}
                </a>
              </div>
            </div>

            <div class="map-card">
              <iframe
                title="${t.mapTitle}"
                src="https://maps.google.com/maps?q=${encodeURIComponent(MAP_QUERY)}&hl=${lang}&z=17&output=embed"
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
              ></iframe>

              <div class="map-foot">
                <p>${t.mapNote}</p>

                <div class="actions">
                  <a
                    class="btn"
                    href="${DIRECTIONS}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${t.directions}
                  </a>

                  <a
                    class="btn alt"
                    href="${MAP_URL}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    ${t.openMap}
                  </a>
                </div>
              </div>
            </div>
          </div>
        </section>
      `;

      document.getElementById('footer').innerHTML = `
        <div class="wrap">
          <div class="footer-top">
            <div>
              <a class="brand" href="#home">
                <img
                  src="logo.jpg"
                  alt="ՍԵՐունդ"
                  width="58"
                  height="58"
                  loading="lazy"
                >

                <div>
                  <strong class="brand-word">ՍԵՐունդ</strong>
                  <small>${t.center}</small>
                </div>
              </a>

              <p class="footer-copy">${t.footerLine}</p>
            </div>

            <div class="footer-links">
              ${ids.map(function (id, index) {
                return `<a href="#${id}">${t.nav[index]}</a>`;
              }).join('')}

              <a href="${PHONE}">
                +374 77 047 947
              </a>
            </div>
          </div>

          <div class="footer-bottom">
            © ${new Date().getFullYear()} · ${t.rights}
          </div>
        </div>
      `;

      document.querySelectorAll('.gallery-open img').forEach(
        function (image) {
          const button = image.closest('button');
          const index = Number(button.dataset.photo);

          function loaded() {
            if (!image.naturalWidth) {
              return;
            }

            readyPhotos.add(index);
            button.disabled = false;

            button.querySelector('.gallery-placeholder').hidden = true;
          }

          function failed() {
            image.hidden = true;
            button.disabled = true;
            readyPhotos.delete(index);
          }

          image.addEventListener('load', loaded);
          image.addEventListener('error', failed);

          if (image.complete) {
            if (image.naturalWidth) {
              loaded();
            } else {
              failed();
            }
          }
        }
      );

      lightbox.setAttribute('aria-label', t.galleryLabel);

      document.getElementById('lightbox-close').textContent =
        t.closePhoto;

      document.getElementById('lightbox-prev').textContent =
        t.previousPhoto;

      document.getElementById('lightbox-next').textContent =
        t.nextPhoto;

      document.querySelectorAll('.portrait img').forEach(
        function (image) {
          image.addEventListener('error', function () {
            image.hidden = true;
          });
        }
      );

      closeMenu();
    }

    menu.addEventListener('click', function () {
      const open =
        menu.getAttribute('aria-expanded') !== 'true';

      nav.classList.toggle('open', open);
      menu.setAttribute('aria-expanded', String(open));
    });

    nav.addEventListener('click', function (event) {
      if (event.target.closest('a')) {
        closeMenu();
      }
    });

    document.addEventListener('click', function (event) {
      const photoButton = event.target.closest('[data-photo]');

      if (photoButton && !photoButton.disabled) {
        showPhoto(Number(photoButton.dataset.photo));
        lightbox.showModal();
      }

      const filter = event.target.closest('[data-filter]');

      if (filter) {
        activeFilter = filter.dataset.filter;

        document.querySelectorAll('[data-filter]').forEach(
          function (button) {
            button.setAttribute(
              'aria-pressed',
              String(button === filter)
            );
          }
        );

        document.querySelectorAll('.card').forEach(
          function (card) {
            card.hidden =
              activeFilter !== 'all' &&
              card.dataset.category !== activeFilter;
          }
        );
      }

      if (!event.target.closest('.header')) {
        closeMenu();
      }
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeMenu();
      }
    });

    window.addEventListener('resize', function () {
      if (window.innerWidth > 950) {
        closeMenu();
      }
    });

    document.querySelectorAll('[data-lang]').forEach(
      function (button) {
        button.addEventListener('click', function () {
          render(button.dataset.lang);

          try {
            localStorage.setItem(
              'serund-language',
              button.dataset.lang
            );
          } catch {}
        });
      }
    );

    let saved = 'hy';

    try {
      saved = localStorage.getItem('serund-language') || 'hy';
    } catch {}

    render(TEXT[saved] ? saved : 'hy');
  </script>
</body>
</html>
